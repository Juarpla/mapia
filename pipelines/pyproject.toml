[project]
name = "mapia-pipelines"
version = "0.2.0"
description = "Procesos reproducibles de normalización vial y detección satelital para MapIA"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0,<2", "rasterio>=1.4,<2", "numpy>=2.0,<3", "shapely>=2.0,<3"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
